name: CI Pipeline (DANAVA Trello)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (PHP 8.2 & Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, zip, pcntl, bcmath
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Copy Testing Environment (.env.testing)
        run: |
          cp .env.testing .env

      - name: Generate Application Key
        run: php artisan key:generate --env=testing

      - name: Run Migrations on Isolated Test Database
        run: php artisan migrate --env=testing --force

      - name: Run Backend Tests
        run: php artisan test

  frontend-ci:
    name: Frontend CI (Node 20 & React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Run Frontend Build
        run: npm run build

  deploy-gate:
    name: Pre-deployment Quality Gate
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Tests and Builds Passed
        run: |
          echo "=========================================================="
          echo "All automated tests, static analysis, and builds passed."
          echo "Backend: PHP 8.2 tests and SQLite migrations PASSED."
          echo "Frontend: Node 20 lint, vitest suites, and Vite build PASSED."
          echo "Release candidate is verified safe for production deployment."
          echo "=========================================================="
